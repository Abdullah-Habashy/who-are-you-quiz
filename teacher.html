<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحليل لعبة التعارف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2FF;--surface:#FFFFFF;--ink:#1E2140;--muted:#5D6088;--line:#DCDAF5;
  --violet:#5B4BDB;--violet-soft:#E7E4FF;--teal:#1F9E91;--coral:#E9505A;--sun:#F5B83D;
  --shadow:0 2px 0 rgba(30,33,64,.12);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14162A;--surface:#1F2240;--ink:#EEECFF;--muted:#A6A8CC;--line:#34386A;
    --violet:#9C90FF;--violet-soft:#2C2D5C;--teal:#3CC2B3;--coral:#FF6F77;--sun:#F5C25A;
    --shadow:0 2px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14162A;--surface:#1F2240;--ink:#EEECFF;--muted:#A6A8CC;--line:#34386A;
  --violet:#9C90FF;--violet-soft:#2C2D5C;--teal:#3CC2B3;--coral:#FF6F77;--sun:#F5C25A;
  --shadow:0 2px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Alexandria",Tahoma,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
.wrap{max-width:700px;margin:0 auto;padding:28px 0 48px}
h1{font-size:28px;line-height:1.3;font-weight:800;margin:0 0 10px}
h2{font-size:21px;line-height:1.3;font-weight:800;margin:30px 0 8px}
h3{margin:16px 0 6px;font-size:17px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.en{direction:ltr;text-align:left;font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;margin:4px 0}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:17px;
  background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:14px 8px;font-weight:600}
.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px}
label.lbl{display:block;font-weight:600;font-size:15px;margin:0 0 6px;color:var(--muted)}
.field{margin:0 0 18px}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
  color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;
  min-height:56px;resize:vertical;direction:ltr;text-align:left}
textarea.big{min-height:100px;font-size:12px}
.err{color:var(--coral);font-size:14px;font-weight:600;margin:4px 0 0}
.lens{margin:0 0 12px}
.lens .t{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.lens .b{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.lens .b i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.lens.top .b i{background:var(--violet)}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.box.flag{border-color:var(--coral)}
.box.warn{border-color:var(--sun)}
.box h3{margin:0 0 6px;font-size:17px}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.item .p{color:var(--muted);font-size:14px}
.ans{font-weight:800}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:2px 8px;background:var(--violet-soft);margin-inline-start:6px}
.tag.c{background:var(--coral);color:#fff}
.parts-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.part-badge{border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;border:2px solid var(--line);background:var(--surface)}
.part-badge.present{border-color:var(--teal);background:var(--teal);color:#fff}
.sep{border:0;border-top:2px solid var(--line);margin:20px 0}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="shared.js"></script>
<script>
var app=document.getElementById("app");
var tData=null;

function renderPaste(){
  var h='<h1>تحليل لعبة التعارف</h1>';
  h+='<p class="muted">الصق أكواد الطالب في الخانات المناسبة، أو الصقهم كلهم في الخانة الكبيرة.</p>';
  h+='<div class="field"><label class="lbl">أو الصق كل الأكواد هنا</label><textarea class="big" id="allcodes" placeholder="الصق كل الأكواد هنا — كل كود في سطر"></textarea></div>';
  h+='<hr class="sep">';
  h+='<div class="field"><label class="lbl">كود الجزء الأول — About You (LQP1)</label><textarea id="c_p1" placeholder="LQP1-..."></textarea></div>';
  h+='<div class="field"><label class="lbl">كود اختيارات سريعة ١ (LQ2A)</label><textarea id="c_2a" placeholder="LQ2A-..."></textarea></div>';
  h+='<div class="field"><label class="lbl">كود اختيارات سريعة ٢ (LQ2B)</label><textarea id="c_2b" placeholder="LQ2B-..."></textarea></div>';
  h+='<div class="field"><label class="lbl">كود اختيارات سريعة ٣ (LQ2C)</label><textarea id="c_2c" placeholder="LQ2C-..."></textarea></div>';
  h+='<p class="err" id="errMsg"></p>';
  h+='<div class="row"><span></span><button class="btn" id="show">اعرض التقرير</button></div>';
  app.innerHTML=h;

  document.getElementById("allcodes").oninput=function(){
    var raw=this.value.trim();if(!raw)return;
    var tokens=raw.split(/[\s\n\r,;]+/);
    tokens.forEach(function(t){
      t=t.trim();if(!t)return;
      if(t.indexOf("LQP1")===0)document.getElementById("c_p1").value=t;
      else if(t.indexOf("LQ2A")===0)document.getElementById("c_2a").value=t;
      else if(t.indexOf("LQ2B")===0)document.getElementById("c_2b").value=t;
      else if(t.indexOf("LQ2C")===0)document.getElementById("c_2c").value=t;
    });
  };

  document.getElementById("show").onclick=function(){
    var codes=[];
    ["c_p1","c_2a","c_2b","c_2c"].forEach(function(id){
      var v=document.getElementById(id).value.trim();
      if(v)codes.push(v);
    });
    if(!codes.length){
      document.getElementById("errMsg").textContent="الصق كود واحد على الأقل.";
      return;
    }
    var merged=mergeAll(codes);
    if(!merged._parts.length){
      document.getElementById("errMsg").textContent="الأكواد مش صحيحة. اتأكد إنها بتبدأ بـ LQP1 أو LQ2A أو LQ2B أو LQ2C.";
      return;
    }
    tData=merged;
    renderReport();
    window.scrollTo(0,0);
  };
}

function lensLine(k,v,top){
  return '<div class="lens'+(top?' top':'')+'"><div class="t"><span>'+LENS[k].ar+'</span><span>'+arDigits(v)+'٪</span></div><div class="b"><i style="width:'+v+'%"></i></div></div>';
}

function renderReport(){
  var d=tData,r=score(d),x=r.x;
  var h='<h1>تحليل لعبة التعارف</h1>';
  h+='<h2 style="margin-top:6px">'+esc(d.n||"طالب")+'</h2>';
  if(d.d)h+='<p class="muted">تاريخ الإجابة '+arDigits(d.d)+'</p>';

  var allP=["LQP1","LQ2A","LQ2B","LQ2C"];
  var labels={"LQP1":"الجزء الأول","LQ2A":"اختيارات ١","LQ2B":"اختيارات ٢","LQ2C":"اختيارات ٣"};
  h+='<div class="parts-row">';
  allP.forEach(function(p){
    var has=d._parts.indexOf(p)>-1;
    h+='<span class="part-badge'+(has?' present':'')+'">'+labels[p]+(has?' ✓':' ✗')+'</span>';
  });
  h+='</div>';

  var missing=allP.filter(function(p){return d._parts.indexOf(p)<0;});
  if(missing.length){
    h+='<div class="box warn"><p style="margin:0">⚠ الأجزاء الناقصة: '+missing.map(function(p){return labels[p];}).join("، ")+'. التحليل مبني على الأجزاء المتاحة فقط.</p></div>';
  }

  var hasP2=d._parts.some(function(p){return p!=="LQP1";});

  if(hasP2){
    h+='<h2>المداخل السبعة</h2>';
    r.rank.forEach(function(k,i){h+=lensLine(k,r.pct[k],i<2);});

    h+='<h2>أقوى مدخلين معاه</h2>';
    r.rank.slice(0,2).forEach(function(k){
      h+='<div class="box"><h3>'+LENS[k].ar+'</h3><p>'+LENS[k].tip+'</p><p class="muted">أمثلة: '+LENS[k].ex+'</p></div>';
    });
    var weak=r.rank[r.rank.length-1];
    h+='<div class="box"><h3>أضعف مدخل: '+LENS[weak].ar+'</h3><p>ما تعتمدش عليه كبداية مع الطالب ده، واستخدمه بس كجزء صغير بعد ما يندمج.</p></div>';

    h+='<h2>طريقة التعامل</h2>';
    var att=x.att,attTxt;
    if(att>=3)attTxt="قريب ومنفتح على الدين. ينفع تتعمق معاه في المعاني والعبادة بشكل مباشر.";
    else if(att<=-2)attTxt="بعيد أو متحفظ تجاه الكلام الديني. ابدأ بالمحتوى غير المباشر والأسئلة والقصص، وتجنب أسلوب الأوامر والوعظ في الأول.";
    else attTxt="محايد. محتاج ربط واضح بحياته واهتماماته قبل أي كلام ديني مباشر.";
    h+='<div class="box"><h3>موقفه من الدين</h3><p>'+attTxt+'</p></div>';

    var sp=x.span+x.spanAdj,spTxt;
    if(sp<=1.5)spTxt="قصير جداً. خلي كل جزء من ٣ لـ ٥ دقايق، وغيّر النشاط كتير.";
    else if(sp<=2.5)spTxt="متوسط. كل جزء من ٥ لـ ٨ دقايق.";
    else spTxt="طويل. يقدر يتابع ١٠ دقايق أو أكتر لو المحتوى شيق.";
    h+='<div class="box"><h3>مدة التركيز</h3><p>'+spTxt+'</p></div>';

    var mind=x.W,heart=x.E,mhTxt;
    if(heart>mind+1)mhTxt="مدخله القلب والمشاعر أكتر من الأدلة. ابدأ بالإحساس والقصة المؤثرة.";
    else if(mind>heart+1)mhTxt="مدخله العقل والإقناع. ابدأ بالحكمة (ليه) قبل الحكم (إيه)، خصوصاً في العبادات.";
    else mhTxt="متوازن بين العقل والقلب. اخلط الدليل بالقصة المؤثرة.";
    h+='<div class="box"><h3>العقل أم القلب</h3><p>'+mhTxt+'</p></div>';

    if(x.cmp>=2)h+='<div class="box"><h3>بيحب المنافسة</h3><p>استخدم النقاط والتحدي ضد الوقت، وممكن يتحدى رقمه القياسي في الحصة اللي فاتت.</p></div>';
    if(x.soc>=2)h+='<div class="box"><h3>بيحب التفاعل مع حد</h3><p>الحوار المتبادل والأدوار التمثيلية هتنفع معاه أكتر من الشرح من طرف واحد.</p></div>';

    if(r.flags.length){
      h+='<h2>ملاحظات تستحق الانتباه</h2>';
      r.flags.forEach(function(f){h+='<div class="box flag"><p style="margin:0">'+f+'</p></div>';});
    }
  }

  if(d._parts.indexOf("LQP1")>-1){
    h+='<h2>إجابات الجزء الأول</h2><div class="box">';
    P1.forEach(function(sec){
      sec.qs.forEach(function(q){
        var v=d.a[q.id];if(Array.isArray(v))v=v.join(", ");
        h+='<div class="item"><div class="p">'+q.ar+'</div><div class="en ans">'+(v?esc(v):'<span class="muted">(skipped)</span>')+'</div></div>';
      });
    });
    h+='</div>';
  }

  if(hasP2){
    h+='<h2>إجابات الاختيارات السريعة</h2>';
    var ranges=[
      {label:"اختيارات سريعة ١",prefix:"LQ2A",r:P2_RANGES.A},
      {label:"اختيارات سريعة ٢",prefix:"LQ2B",r:P2_RANGES.B},
      {label:"اختيارات سريعة ٣",prefix:"LQ2C",r:P2_RANGES.C}
    ];
    ranges.forEach(function(rng){
      if(d._parts.indexOf(rng.prefix)<0)return;
      h+='<h3>'+rng.label+'</h3><div class="box">';
      for(var i=rng.r.s;i<rng.r.e;i++){
        var q=P2[i],c=d.b[i],o=q.o[c],cu=d.c[i]||"";
        h+='<div class="item"><div class="p">'+arDigits(i+1)+'. '+(q.decoy?'سؤال تمويه':q.ar)+(o&&o[2]?'<span class="tag c">ملاحظة</span>':'')+(cu?'<span class="tag c">إجابة بكلامه</span>':'')+'</div>';
        h+='<div class="en">'+esc(q.t)+'</div>';
        h+='<div class="en ans">'+(o?esc(o[0]):cu?esc(cu):'<span class="muted">(no answer)</span>')+'</div></div>';
      }
      h+='</div>';
    });
  }

  if(d._parts.indexOf("LQ2C")>-1){
    h+='<h2>الأسئلة المفتوحة</h2><div class="box">';
    FINAL.forEach(function(q){
      var v=d.a[q.id];
      h+='<div class="item"><div class="p">'+q.ar+'</div><div class="en ans">'+(v?esc(v):'<span class="muted">(skipped)</span>')+'</div></div>';
    });
    h+='</div>';
  }

  h+='<div class="row"><button class="btn ghost" id="nw">تقرير طالب تاني</button></div>';
  app.innerHTML=h;
  document.getElementById("nw").onclick=function(){tData=null;renderPaste();window.scrollTo(0,0);};
}

renderPaste();
</script>
</body>
</html>
