<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Picks II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBEB;--surface:#FFFFFF;--ink:#451A03;--muted:#92620B;--line:#FEF3C7;
  --accent:#B45309;--highlight:#8B5CF6;--highlight-soft:#EDE9FE;
  --shadow:0 0 0 4px var(--accent),0 5px 0 var(--ink);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1306;--surface:#2D2010;--ink:#FEF3C7;--muted:#C4930F;--line:#44360F;
    --accent:#FBBF24;--highlight:#A78BFA;--highlight-soft:#2E2250;
    --shadow:0 0 0 4px var(--accent),0 5px 0 #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1306;--surface:#2D2010;--ink:#FEF3C7;--muted:#C4930F;--line:#44360F;
  --accent:#FBBF24;--highlight:#A78BFA;--highlight-soft:#2E2250;
  --shadow:0 0 0 4px var(--accent),0 5px 0 #000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0}
.wrap{max-width:640px;margin:0 auto;padding:28px 0 48px}
h1{font-size:clamp(32px,8vw,50px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:24px;line-height:1.15;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.step{font-weight:600;color:var(--accent);font-size:15px;margin-bottom:10px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;border:0;border-radius:99px;padding:14px 24px;font-weight:800;font-size:17px;
  background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:14px 8px;font-weight:600}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px}

/* dots progress */
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 22px}
.dots i{display:block;width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.done{background:var(--accent)}
.dots i.cur{background:var(--highlight);transform:scale(1.25)}

/* card deck */
.deck{position:relative;margin:8px 0 0}
.deck::before,.deck::after{content:"";position:absolute;left:14px;right:14px;height:100%;border-radius:28px;background:var(--surface);border:2px solid var(--line)}
.deck::before{top:16px;transform:rotate(-2deg);opacity:.5}
.deck::after{top:8px;transform:rotate(1.2deg);opacity:.75}
.card{position:relative;z-index:1;background:var(--surface);border:3px solid var(--ink);border-radius:28px;padding:28px 22px 22px;
  box-shadow:var(--shadow)}
.card .qt{font-size:22px;font-weight:800;line-height:1.2;margin:0 0 20px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  border:2px solid var(--line);background:var(--bg);
  border-radius:99px;padding:13px 18px;font-weight:600;font-size:16px;
  transition:transform .12s ease,background .12s ease}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px}
.opt:hover{transform:translateX(3px)}
.opt.sel{background:var(--highlight);border-color:var(--highlight);color:#fff}
.opt.sel .k{background:#fff;border-color:var(--highlight);color:var(--highlight)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:19px;padding:18px}
.card.slidein{animation:slidein .3s ease}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.card.slidein{animation:none}.opt:hover{transform:none}.dots i{transition:none}}

.hero-badge{width:120px;height:120px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:58px;margin:0 0 22px;transform:rotate(-4deg)}
.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:100px;word-break:break-all;
  background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical}
.ok{color:var(--highlight);font-weight:800}
.other{width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);
  border:2px dashed var(--line);border-radius:99px;padding:13px 18px;margin-top:10px}
.other::placeholder{color:var(--muted);font-weight:400}
.other.picked{background:var(--highlight);border:2px solid var(--highlight);color:#fff}

.home-float{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  z-index:100;border:2px solid var(--ink);background:var(--accent);color:#fff;border-radius:50%;
  width:44px;height:44px;display:grid;place-items:center;font-size:20px;
  box-shadow:0 3px 0 var(--ink);cursor:pointer;text-decoration:none;line-height:1}
.home-float:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
</style>
</head>
<body>
<a class="home-float" href="index.html" title="Back to hub">🏠</a>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="shared.js"></script>
<script>
var PART_KEY="lq_2b";
var RANGE=P2_RANGES.B;
var COUNT=RANGE.e-RANGE.s;
var st=getPartState(PART_KEY)||{q:0,b:[],c:{}};
var app=document.getElementById("app");

function save(){setPartState(PART_KEY,st);}

function dotsHTML(cur,total){
  var h='<div class="dots">';
  for(var i=0;i<total;i++){
    var cls="";
    if(i<cur)cls="done";
    else if(i===cur)cls="cur";
    h+='<i class="'+cls+'"></i>';
  }
  return h+'</div>';
}

function render(){
  var s=st.screen||"intro";
  if(s==="intro")renderIntro();
  else if(s==="quiz")renderQ();
  else if(s==="done")renderDone();
}

function renderIntro(){
  app.innerHTML='<div class="hero-badge" aria-hidden="true">🎲</div>'+
  '<h1>Quick Picks II</h1>'+
  '<p class="muted">Keep going — you’re halfway there! Same rules: tap whatever feels right.</p>'+
  '<div class="row"><button class="btn ghost" id="bk">Back to hub</button><button class="btn" id="go">Let’s go</button></div>';
  document.getElementById("bk").onclick=function(){location.href="index.html";};
  document.getElementById("go").onclick=function(){st.screen="quiz";save();render();window.scrollTo(0,0);};
}

function renderQ(){
  var i=st.q;
  if(i>=COUNT){st.screen="done";save();render();return;}
  var gi=RANGE.s+i;
  var q=P2[gi];
  var chosen=st.b[i];
  var h='<div class="step">Quick picks II, '+(i+1)+' of '+COUNT+'</div>';
  h+=dotsHTML(i,COUNT);
  h+='<div class="deck"><div class="card slidein"><div class="qt">'+esc(q.t)+'</div><div class="opts'+(q.tf?' tf':'')+'">';
  q.o.forEach(function(o,k){
    h+='<button type="button" class="opt'+(chosen===k?' sel':'')+'" data-k="'+k+'">'+(q.tf?'':'<span class="k" aria-hidden="true">'+String.fromCharCode(65+k)+'</span>')+'<span>'+esc(o[0])+'</span></button>';
  });
  h+='</div>';
  h+='<input type="text" class="other'+(chosen==="x"?' picked':'')+'" id="oth" aria-label="Something else" placeholder="Something else? Type it and press Enter" value="'+esc(chosen==="x"?(st.c[i]||""):"")+'"></div></div>';
  h+='<div class="row"><button class="btn ghost" id="bk">Back</button><span></span></div>';
  app.innerHTML=h;

  var lock=false;
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    if(lock)return;lock=true;
    st.b[i]=+b.dataset.k;delete st.c[i];save();
    app.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("sel",x===b);});
    setTimeout(function(){st.q=i+1;save();render();window.scrollTo(0,0);},260);
  };});

  var oth=document.getElementById("oth");
  if(oth)oth.onkeydown=function(e){
    if(e.key!=="Enter"||e.isComposing)return;e.preventDefault();
    var v=this.value.trim();if(!v||lock)return;lock=true;
    st.b[i]="x";st.c[i]=v;save();this.classList.add("picked");
    app.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel");});
    setTimeout(function(){st.q=i+1;save();render();window.scrollTo(0,0);},260);
  };

  document.getElementById("bk").onclick=function(){
    if(st.q>0){st.q--;save();render();}
    else{st.screen="intro";save();render();}
    window.scrollTo(0,0);
  };
}

function renderDone(){
  var code=encodePart("LQ2B",{v:2,n:getName(),d:new Date().toISOString().slice(0,10),off:RANGE.s,b:st.b,c:st.c});
  setPartCode(PART_KEY,code);
  app.innerHTML='<div class="hero-badge" aria-hidden="true">🎲</div>'+
  '<h1>Part done!</h1>'+
  '<p class="muted">Copy this code and send it to your teacher, or save it for later.</p>'+
  '<textarea class="code" id="code" readonly>'+code+'</textarea>'+
  '<div class="row"><button class="btn ghost" id="cp">Copy code</button><a class="btn" href="part2c.html">Next: Quick Picks III →</a></div>'+
  '<p id="msg" class="ok" style="text-align:center;min-height:24px"></p>'+
  '<div style="text-align:center;margin-top:16px"><a href="index.html" style="color:var(--muted)">Back to hub</a></div>';

  document.getElementById("cp").onclick=function(){
    var m=document.getElementById("msg");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){m.textContent="Copied!";},function(){fallbackCopy(m);});
    }else{fallbackCopy(m);}
  };
  function fallbackCopy(m){
    var ta=document.getElementById("code");ta.focus();ta.select();
    try{document.execCommand("copy");m.textContent="Copied!";}catch(e){m.textContent="Select the code and copy it manually";}
  }
}

render();
</script>
</body>
</html>
