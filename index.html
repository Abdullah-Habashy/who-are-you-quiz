<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Are You, Really?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F7FF; --surface: #FFFFFF; --ink: #1E2140; --muted: #5D6088; --line: #DCDAF5;
  --violet: #5B4BDB; --teal: #0F766E; --amber: #B45309; --coral: #BE123C;
  --shadow: 0 2px 12px rgba(30,33,64,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111328; --surface: #1C1E3A; --ink: #EEECFF; --muted: #A6A8CC; --line: #2E3260;
    --violet: #9C90FF; --teal: #3CC2B3; --amber: #FBBF24; --coral: #FF6F77;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111328; --surface: #1C1E3A; --ink: #EEECFF; --muted: #A6A8CC; --line: #2E3260;
  --violet: #9C90FF; --teal: #3CC2B3; --amber: #FBBF24; --coral: #FF6F77;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box }
html { height: 100% }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.wrap { max-width: 600px; margin: 0 auto; padding-block: 36px 56px }
h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px }
p { margin: 0 0 14px }
.muted { color: var(--muted) }
.field { margin: 0 0 28px }
label.q { display: block; font-weight: 600; margin: 0 0 8px }
input[type=text] {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
input:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr } }
.card {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 20px 18px; text-decoration: none; color: var(--ink);
  box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease;
  position: relative; overflow: hidden;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(30,33,64,.1) }
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.card.v::before { background: var(--violet) }
.card.t::before { background: var(--teal) }
.card.a::before { background: var(--amber) }
.card.c::before { background: var(--coral) }
.card .num { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em }
.card.v .num { color: var(--violet) }
.card.t .num { color: var(--teal) }
.card.a .num { color: var(--amber) }
.card.c .num { color: var(--coral) }
.card .title { font-size: 20px; font-weight: 800; line-height: 1.15; margin: 0 }
.card .desc { font-size: 14px; color: var(--muted); margin: 0 }
.badge {
  display: inline-block; font-size: 12px; font-weight: 700; border-radius: 8px;
  padding: 3px 10px; margin-top: 4px; align-self: flex-start;
}
.badge.done { background: #D1FAE5; color: #065F46 }
.badge.prog { background: #FEF3C7; color: #92400E }
.badge.none { background: var(--line); color: var(--muted) }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge.done { background: #064E3B; color: #6EE7B7 }
  :root:not([data-theme="light"]) .badge.prog { background: #78350F; color: #FDE68A }
}
:root[data-theme="dark"] .badge.done { background: #064E3B; color: #6EE7B7 }
:root[data-theme="dark"] .badge.prog { background: #78350F; color: #FDE68A }
.shake { animation: shake .4s ease }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
@media (prefers-reduced-motion: reduce) { .shake { animation: none } .card:hover { transform: none } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Who are you, really?</h1>
  <p class="muted">A quick game about the stuff you like. Pick any part to start — do them in order or jump around.</p>

  <div class="field">
    <label class="q" for="nm">What should we call you?</label>
    <input type="text" id="nm" autocomplete="off" placeholder="Your name">
  </div>

  <div class="grid" id="grid"></div>

</div>

<script src="shared.js"></script>
<script>
var PARTS = [
  { key: "lq_p1", href: "part1.html", cls: "v", num: "Part 1", title: "About You", desc: "Hobbies, games, shows, and how you spend your time." },
  { key: "lq_2a", href: "part2a.html", cls: "t", num: "Part 2 · A", title: "Quick Picks I", desc: "Superpowers, riddles, and would-you-rather." },
  { key: "lq_2b", href: "part2b.html", cls: "a", num: "Part 2 · B", title: "Quick Picks II", desc: "Museums, movies, and tricky questions." },
  { key: "lq_2c", href: "part2c.html", cls: "c", num: "Part 2 · C", title: "Quick Picks III", desc: "Challenges, debates, and big questions." }
];

var nmInput = document.getElementById("nm");
nmInput.value = getName();
nmInput.oninput = function () { setName(nmInput.value.trim()); };

function buildGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  PARTS.forEach(function (p) {
    var code = getPartCode(p.key);
    var state = getPartState(p.key);
    var status, cls;
    if (code) { status = "Done ✓"; cls = "done"; }
    else if (state) { status = "In progress"; cls = "prog"; }
    else { status = "Not started"; cls = "none"; }

    var a = document.createElement("a");
    a.className = "card " + p.cls;
    a.href = p.href;
    a.innerHTML =
      '<div class="num">' + esc(p.num) + '</div>' +
      '<div class="title">' + esc(p.title) + '</div>' +
      '<p class="desc">' + esc(p.desc) + '</p>' +
      '<span class="badge ' + cls + '">' + status + '</span>';

    a.onclick = function (e) {
      if (!nmInput.value.trim()) {
        e.preventDefault();
        nmInput.focus();
        nmInput.classList.remove("shake");
        void nmInput.offsetWidth;
        nmInput.classList.add("shake");
      }
    };
    grid.appendChild(a);
  });
}

buildGrid();
window.addEventListener("focus", buildGrid);
</script>
</body>
</html>
