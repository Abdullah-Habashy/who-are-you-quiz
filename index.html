<style>
:root{
  --bg:#F3F2FF; --surface:#FFFFFF; --ink:#1E2140; --muted:#5D6088; --line:#DCDAF5;
  --sun:#F5B83D; --teal:#1F9E91; --coral:#E9505A; --violet:#5B4BDB; --violet-soft:#E7E4FF;
  --shadow:0 2px 0 rgba(30,33,64,.12);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14162A; --surface:#1F2240; --ink:#EEECFF; --muted:#A6A8CC; --line:#34386A;
    --sun:#F5C25A; --teal:#3CC2B3; --coral:#FF6F77; --violet:#9C90FF; --violet-soft:#2C2D5C;
    --shadow:0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14162A; --surface:#1F2240; --ink:#EEECFF; --muted:#A6A8CC; --line:#34386A;
  --sun:#F5C25A; --teal:#3CC2B3; --coral:#FF6F77; --violet:#9C90FF; --violet-soft:#2C2D5C;
  --shadow:0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(34px,8vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:26px;line-height:1.15;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.step{font-weight:600;color:var(--violet);font-size:15px;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 22px}
.bar > i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s ease}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:17px;
  background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:14px 8px;font-weight:600}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px}
label.q{display:block;font-weight:600;margin:0 0 8px}
.field{margin:0 0 22px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
/* the deck */
.deck{position:relative;margin:8px 0 0}
.deck::before,.deck::after{content:"";position:absolute;left:14px;right:14px;height:100%;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.deck::before{top:16px;transform:rotate(-2.2deg);opacity:.55}
.deck::after{top:8px;transform:rotate(1.4deg);opacity:.8}
.card{position:relative;z-index:1;background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:26px 22px 22px;box-shadow:0 6px 0 var(--ink)}
.card .qt{font-size:23px;font-weight:800;line-height:1.2;margin:0 0 20px;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--bg);
  border-radius:14px;padding:13px 14px;font-weight:600;font-size:16px;transition:transform .12s ease,background .12s ease}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px}
.opt:hover{transform:translateX(3px)}
.opt.sel{background:var(--sun);border-color:var(--ink);color:#1E2140}
.opt.sel .k{background:#fff;border-color:#1E2140;color:#1E2140}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:19px;padding:18px}
.card.flip{animation:flip .28s ease}
@keyframes flip{from{transform:translateY(10px) rotate(1deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}.opt:hover{transform:none}.bar>i{transition:none}}
.hero-badge{width:120px;height:120px;border-radius:30px;background:var(--sun);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  display:grid;place-items:center;font-size:58px;margin:0 0 22px;transform:rotate(-4deg)}
.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:110px;word-break:break-all}
.note{background:var(--violet-soft);border-radius:14px;padding:14px 16px;font-size:15px;margin:16px 0}
.ok{color:var(--teal);font-weight:800}
/* teacher view (Arabic) */
.ar{direction:rtl;text-align:right;font-family:"Alexandria",Tahoma,"Segoe UI",sans-serif;line-height:1.85}
.ar h1{font-size:30px;line-height:1.3}
.ar h2{font-size:21px;margin-top:30px}
.ar .en{direction:ltr;text-align:left;font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;margin:4px 0}
.tabs{display:flex;gap:8px;margin:8px 0 20px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-family:inherit}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lens{margin:0 0 12px}
.lens .t{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.lens .b{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.lens .b i{display:block;height:100%;background:var(--teal);border-radius:99px}
.lens.top .b i{background:var(--violet)}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.box.flag{border-color:var(--coral)}
.box h3{margin:0 0 6px;font-size:17px}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.item .p{color:var(--muted);font-size:14px}
.ans{font-weight:800}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:2px 8px;background:var(--violet-soft);margin-inline-start:6px}
.tag.c{background:var(--coral);color:#fff}
.hidden{display:none}
.other{width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
.other::placeholder{color:var(--muted);font-weight:400}
.other.picked{background:var(--sun);border:2px solid var(--ink);color:#1E2140}
.chips + .other{border-radius:99px;padding:8px 16px;font-size:15px}
.pdfmode{--bg:#fff;--surface:#fff;--ink:#1E2140;--muted:#5D6088;--line:#DCDAF5;--teal:#1F9E91;--coral:#E9505A;--violet:#5B4BDB;--violet-soft:#E7E4FF;color:#1E2140;background:#fff;font-size:16px;letter-spacing:0}
.pdfmode *{letter-spacing:0!important}
</style>
</head>

/* ---------------- encode / decode ---------------- */
function encode(){
  var json=JSON.stringify({v:1,n:st.name,d:new Date().toISOString().slice(0,10),a:st.a,b:st.b,c:st.c});
  var b64=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "LQ1-"+b64;
}
function decode(code){
  code=code.replace(/\s+/g,"");
  if(code.indexOf("LQ1-")!==0)throw new Error("bad");
  var b=code.slice(4).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4)b+="=";
  return JSON.parse(decodeURIComponent(escape(atob(b))));
}

/* ---------------- scoring ---------------- */
function score(d){
  var tot={},max={};LORDER.forEach(function(k){tot[k]=0;max[k]=0;});
  var x={att:0,W:0,E:0,cmp:0,soc:0,span:2,spanAdj:0},flags=[];
  P2.forEach(function(q,i){
    LORDER.forEach(function(k){var m=0;q.o.forEach(function(o){if((o[1][k]||0)>m)m=o[1][k];});max[k]+=m;});
    var c=d.b[i];if(c==null||!q.o[c])return;
    var s=q.o[c][1];
    LORDER.forEach(function(k){if(s[k])tot[k]+=s[k];});
    ["att","W","E","cmp","soc","spanAdj"].forEach(function(k){if(s[k])x[k]+=s[k];});
    if(s.span)x.span=s.span;
    if(q.o[c][2])flags.push(q.o[c][2]);
  });
  var g3=d.a.g3||[];if(g3.some(function(v){return v!=="Alone";}))x.soc+=1;
  var g5=d.a.g5||[];if(g5.indexOf("Winning and competing")>-1)x.cmp+=1;
  var pct={};LORDER.forEach(function(k){pct[k]=max[k]?Math.max(0,Math.round(tot[k]/max[k]*100)):0;});
  var rank=LORDER.slice().sort(function(a,b){return pct[b]-pct[a];});
  return {pct:pct,rank:rank,x:x,flags:flags};
}

  h+='<div class="box"><h3>العقل أم القلب</h3><p>'+mhTxt+'</p></div>';
  if(x.cmp>=2)h+='<div class="box"><h3>بيحب المنافسة</h3><p>استخدم النقاط والتحدي ضد الوقت، وممكن يتحدى رقمه القياسي في الحصة اللي فاتت.</p></div>';
  if(x.soc>=2)h+='<div class="box"><h3>بيحب التفاعل مع حد</h3><p>الحوار المتبادل والأدوار التمثيلية هتنفع معاه أكتر من الشرح من طرف واحد.</p></div>';
  if(r.flags.length){
    h+='<h2>ملاحظات تستحق الانتباه</h2>';
    r.flags.forEach(function(f){h+='<div class="box flag"><p style="margin:0">'+f+'</p></div>';});
  }
  h+='<h2>إجابات الجزء الأول</h2><div class="box">';
  P1.forEach(function(sec){
    sec.qs.forEach(function(q){
      var v=d.a[q.id];if(Array.isArray(v))v=v.join(", ");
      h+='<div class="item"><div class="p">'+q.ar+'</div><div class="en ans">'+(v?esc(v):'<span class="muted">(skipped)</span>')+'</div></div>';
    });
  });
  FINAL.forEach(function(q){var v=d.a[q.id];h+='<div class="item"><div class="p">'+q.ar+'</div><div class="en ans">'+(v?esc(v):'<span class="muted">(skipped)</span>')+'</div></div>';});
  h+='</div><h2>إجابات الجزء التاني</h2><div class="box">';
  P2.forEach(function(q,i){
    var c=d.b[i],o=q.o[c],cu=(c==="x"&&d.c)?d.c[i]:"";
    h+='<div class="item"><div class="p">'+arDigits(i+1)+'. '+(q.decoy?'سؤال تمويه':q.ar)+(o&&o[2]?'<span class="tag c">ملاحظة</span>':'')+(cu?'<span class="tag c">إجابة بكلامه</span>':'')+'</div>'+
    '<div class="en">'+esc(q.t)+'</div><div class="en ans">'+(o?esc(o[0]):cu?esc(cu):'<span class="muted">(no answer)</span>')+'</div></div>';
  });
  h+='</div>';
  return h;
}
function ptsAr(s){
  var out=[];
  LORDER.forEach(function(k){if(s[k])out.push(LENS[k].ar+" "+(s[k]>0?"+":"−")+arDigits(Math.abs(s[k])));});
  if(s.att)out.push("القرب من الدين "+(s.att>0?"+":"−")+arDigits(Math.abs(s.att)));
  if(s.W)out.push("يحتاج الحكمة +"+arDigits(s.W));
  if(s.E)out.push("مدخل القلب +"+arDigits(s.E));
  if(s.cmp)out.push("المنافسة +"+arDigits(s.cmp));
  if(s.soc)out.push("التفاعل مع الآخرين +"+arDigits(s.soc));
  if(s.span)out.push("مدة التركيز: "+["","قصيرة","متوسطة","طويلة"][s.span]);
  if(s.spanAdj)out.push("تقلل مدة التركيز");
  return out.length?out.join("، "):"بدون نقاط";
}
function keyHTML(){
  var h='<p class="muted">كل سؤال في الجزء التاني وغرضه الخفي، وكل اختيار بيدّي نقاط لأنهي مدخل.</p><div class="box">';
  P2.forEach(function(q,i){
    h+='<div class="item"><div><strong>'+arDigits(i+1)+'.</strong> '+(q.decoy?'سؤال تمويه، ملوش أي غرض.':q.ar)+'</div><div class="en">'+esc(q.t)+'</div>';
    if(!q.decoy)q.o.forEach(function(o){h+='<div class="en" style="margin-top:8px">'+esc(o[0])+'</div><div class="p">'+ptsAr(o[1])+(o[2]?'<span class="tag c">ملاحظة</span>':'')+'</div>';});
    h+='</div>';
  });
  return h+'</div>';
}
var libsP=null;
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function loadLibs(){
  if(!libsP)libsP=Promise.all([
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
  ]).catch(function(e){libsP=null;throw e;});
  return libsP;
}
async function makePDF(d){
  await loadLibs();
  try{await document.fonts.ready;}catch(e){}
  var box=document.createElement("div");
  box.className="ar pdfmode";
  box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;padding:0 6px";
  box.innerHTML='<h1>تحليل لعبة التعارف</h1>'+reportHTML(d);
  document.body.appendChild(box);
  var blocks=[];
  Array.prototype.forEach.call(box.children,function(el){
    var items=el.classList.contains("box")?el.querySelectorAll(":scope > .item"):[];
    if(items.length>2)Array.prototype.forEach.call(items,function(it){blocks.push(it);});
    else blocks.push(el);
  });
  var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  var W=210,H=297,M=14,UW=W-2*M,y=M;
  try{
    for(var i=0;i<blocks.length;i++){
      var el=blocks[i];
      var c=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      if(!c.width||!c.height)continue;
      var h=c.height*UW/c.width,isHead=/^H[123]$/.test(el.tagName);
      if(isHead&&y>M)y+=4;
      if(h<=H-2*M){
        if(y+h+(isHead?18:0)>H-M){pdf.addPage();y=M;}
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",M,y,UW,h);
        y+=h+(isHead?1:3);
      }else{
        var pxPerMm=c.width/UW,off=0;
        while(off<c.height){
          if(y>H-M-20){pdf.addPage();y=M;}
          var sliceH=Math.min(c.height-off,Math.floor((H-M-y)*pxPerMm));
          var t=document.createElement("canvas");t.width=c.width;t.height=sliceH;
          t.getContext("2d").drawImage(c,0,off,c.width,sliceH,0,0,c.width,sliceH);
          var sh=sliceH/pxPerMm;
          pdf.addImage(t.toDataURL("image/jpeg",0.92),"JPEG",M,y,UW,sh);
          off+=sliceH;y+=sh;
          if(off<c.height){pdf.addPage();y=M;}
        }
        y+=3;
      }
    }
  }finally{document.body.removeChild(box);}
  return pdf.output("blob");
}
async function downloadReport(){
  var m=document.getElementById("dm"),b=document.getElementById("dl");
  b.disabled=true;m.textContent="جاري تجهيز الملف، استنى ثواني…";
  try{
    var dl=null;
    try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
    var blob=await makePDF(tState.data);
    var fname="report-"+(tState.data.n||"student").replace(/[^\w\u0600-\u06FF]+/g,"-")+".pdf";
    m.textContent="";
    if(!dl){
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      m.textContent="اتحفظ الملف.";return;
    }
    await dl.save({filename:fname,data:blob});
    m.textContent="اتحفظ الملف.";
  }catch(e){
    m.textContent=(e&&e.code==="declined")?"التحميل اتلغى.":"الملف ما اتعملش. ابعت الكود في المحادثة وهطلعلك الملف.";
  }finally{b.disabled=false;}
}
